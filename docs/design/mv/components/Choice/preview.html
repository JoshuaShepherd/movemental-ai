<!-- @dsCard group="Forms" height=330 subtitle="Checkbox, switch and a three-level radio" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--ground,#fff);color:var(--ink,#1C1D24);font-family:'Geist','Helvetica Neue',Arial,sans-serif}
.wrap{padding:24px;display:flex;flex-direction:column;gap:16px}
.d{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.r{font-family:'Source Serif 4',Georgia,serif}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;font:500 16px 'Geist','Helvetica Neue',Arial,sans-serif;color:#fff;background:var(--ink,#1C1D24);border:none;border-radius:999px;cursor:pointer;text-decoration:none}
.lnk{display:inline-flex;align-items:center;min-height:44px;padding:0;font:15px 'Geist','Helvetica Neue',Arial,sans-serif;color:var(--ink,#1C1D24);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.q{color:var(--graphite,#5B5E6B)}
a{color:var(--ink,#1C1D24);text-underline-offset:4px}
:focus-visible{outline:2px solid var(--accent,#2236C4);outline-offset:3px}
input,textarea{font:16px/1.5 'Geist','Helvetica Neue',Arial,sans-serif;color:var(--ink,#1C1D24);background:#fff;border:1px solid var(--rule,#DDDFE5);border-radius:6px;padding:12px 14px;box-sizing:border-box;width:100%}
</style></head><body><div class="wrap">
<button type="button" role="checkbox" aria-checked="true" style="display:flex;align-items:center;gap:14px;min-height:44px;padding:0;font-size:15.5px;color:#1C1D24;background:none;border:none;text-align:left"><span aria-hidden="true" style="width:22px;height:22px;border:1.5px solid #1C1D24;border-radius:4px;background:#1C1D24;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">✓</span>Count my choices in Riverbend’s view</button>
<button type="button" role="switch" aria-checked="false" style="display:flex;align-items:center;gap:14px;min-height:48px;padding:0;font-size:15px;color:#1C1D24;background:none;border:none;text-align:left"><span aria-hidden="true" style="width:40px;height:22px;border-radius:999px;padding:2px;box-sizing:border-box;background:#DDDFE5"><span style="display:block;width:18px;height:18px;border-radius:50%;background:#fff"></span></span>Also count it in published research</button>
<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px"><legend style="font-size:15px;font-weight:500;margin-bottom:6px">Who can see it</legend>
<label style="display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:6px;background:#E8EBFA"><input type="radio" name="v" checked style="width:auto;margin-top:4px"><span><span style="font-weight:500">Private</span><br><span class="q" style="font-size:14px">Only you.</span></span></label>
<label style="display:flex;gap:12px;align-items:flex-start;padding:10px 12px"><input type="radio" name="v" style="width:auto;margin-top:4px"><span><span style="font-weight:500">Anyone with the link</span><br><span class="q" style="font-size:14px">Not listed anywhere.</span></span></label></fieldset>
</div></body></html>
