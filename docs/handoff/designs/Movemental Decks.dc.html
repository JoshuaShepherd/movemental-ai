<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/colors.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/typography.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/styles.css">
  <script src="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--text-strong); font-family: var(--font-body), system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--accent-press); text-decoration: underline; text-underline-offset: 3px; }
  </style>
</helmet>

<div>
  <div>
    <x-import component-from-global-scope="deck-stage" from="./deck-stage.js" width="1920" height="1080" hint-size="100%,100%">
      <sc-for list="{{ slides }}" as="s" hint-placeholder-count="11">
        <section data-label="{{ s.label }}" data-speaker-notes="{{ s.notes }}" style="{{ s.sectionStyle }}">

          <div style="{{ s.eyebrowStyle }}">{{ s.eyebrow }}</div>

          <h2 style="{{ s.headingStyle }}">
            <sc-for list="{{ s.headingParts }}" as="h" hint-placeholder-count="1">
              <span style="{{ h.style }}">{{ h.text }}</span>
            </sc-for>
          </h2>

          <sc-if value="{{ s.hasParts }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; gap: 64px; margin-top: 56px; width: 100%;">
              <sc-for list="{{ s.parts }}" as="p" hint-placeholder-count="2">
                <div style="flex: 1 1 0; min-width: 0; border-top: 2px solid #1A1714; padding-top: 28px;">
                  <div style="font-family: var(--font-mono), ui-monospace, monospace; font-size: 26px; letter-spacing: .16em; color: #6B625A;">{{ p.n }}</div>
                  <div style="font-family: var(--font-display), Georgia, serif; font-weight: 600; font-size: 46px; line-height: 1.14; letter-spacing: -.02em; margin-top: 18px;">{{ p.title }}</div>
                  <div style="font-size: 32px; line-height: 1.44; color: #4A433C; margin-top: 18px;">{{ p.desc }}</div>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ s.hasBody }}" hint-placeholder-val="{{ true }}">
            <div style="{{ s.bodyWrapStyle }}">
              <sc-for list="{{ s.body }}" as="b" hint-placeholder-count="2">
                <p style="{{ s.bodyStyle }}">
                  <sc-for list="{{ b.parts }}" as="bp" hint-placeholder-count="1">
                    <span style="{{ bp.style }}">{{ bp.text }}</span>
                  </sc-for>
                </p>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ s.isDiagram }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; gap: 56px; margin-top: 52px; width: 100%; align-items: stretch;">
              <div style="flex: 1 1 0; min-width: 0; border: 2px solid #E5DFD2; border-radius: 20px; padding: 36px; background: #FFFDF7;">
                <div style="font-family: var(--font-mono), ui-monospace, monospace; font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: #6B625A;">{{ s.offLabel }}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px;">
                  <sc-for list="{{ s.surfaceTiles }}" as="t" hint-placeholder-count="4">
                    <span style="font-size: 26px; border: 1px solid #E5DFD2; border-radius: 999px; padding: 10px 20px; color: #4A433C;">{{ t }}</span>
                  </sc-for>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px;">
                  <sc-for list="{{ s.surfaceChips }}" as="c" hint-placeholder-count="3">
                    <span style="font-family: var(--font-mono), ui-monospace, monospace; font-size: 22px; letter-spacing: .1em; text-transform: uppercase; color: #6B625A; border: 1px dashed #E5DFD2; border-radius: 999px; padding: 8px 16px;">{{ c }}</span>
                  </sc-for>
                </div>
                <p style="font-size: 27px; line-height: 1.46; color: #4A433C; margin: 28px 0 0;">{{ s.captionSite }}</p>
              </div>
              <div style="flex: 1 1 0; min-width: 0; border: 2px solid #1A1714; border-radius: 20px; padding: 36px; background: #FFFDF7;">
                <div style="font-family: var(--font-mono), ui-monospace, monospace; font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: #22409B;">{{ s.onLabel }}</div>
                <div style="display: grid; gap: 14px; margin-top: 24px;">
                  <sc-for list="{{ s.systemTiles }}" as="t" hint-placeholder-count="4">
                    <div style="display: flex; gap: 18px; align-items: baseline; border-bottom: 1px solid #E5DFD2; padding-bottom: 12px;">
                      <span style="flex: 1 1 0; font-size: 28px; font-weight: 500; color: #1A1714;">{{ t.title }}</span>
                      <span style="flex: 0 0 auto; font-family: var(--font-mono), ui-monospace, monospace; font-size: 21px; letter-spacing: .06em; color: #6B625A;">{{ t.platform }}</span>
                    </div>
                  </sc-for>
                </div>
                <p style="font-size: 27px; line-height: 1.46; color: #4A433C; margin: 28px 0 0;">{{ s.captionHome }}</p>
              </div>
            </div>
          </sc-if>

          <div style="{{ s.footStyle }}">{{ s.foot }}</div>
        </section>
      </sc-for>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;audience&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;churches&quot;,&quot;nonprofits&quot;,&quot;institutions&quot;],&quot;default&quot;:&quot;churches&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Deck&quot;}}">
/**
 * `/agent/{churches,nonprofits,institutions}/deck` — three decks, one file.
 *
 * IMPORTANT correction to build prompt 15. The prompt specified a nine-beat
 * sequence — evidence cards, the four stages, the Charter's five layers, two
 * ways to do it, the flat price. That deck does not exist. The three real decks
 * in `src/components/agent-room/deck/` are a different argument entirely:
 * "Why a platform, not a website builder?" (churches, nonprofits) and
 * "Movemental, or a website builder?" (institutions) — an eleven-slide category
 * and price reframe.
 *
 * The prompt's own honesty constraint settles it: "No invented slides. If the
 * deck data has fewer beats than the sequence above, ship fewer slides." So
 * these are the real decks — `churchDeck`, `nonprofitDeck`, `institutionDeck` —
 * slide for slide, word for word, in their own order.
 *
 * Consequences worth naming:
 * - There are no statistics on these slides, so the "every statistic keeps its
 *   source" rule has nothing to apply to. Nothing was added to give it work.
 * - The measured-claim / structural-pattern distinction likewise does not arise:
 *   the institution deck argues from category, not from survey numbers.
 * - `DeckGesture` is honoured as the data specifies it: at most one per slide,
 *   exactly one highlighter swipe per deck, matched against the heading first
 *   and then the body — the discipline the deck files call out by name.
 *
 * Speaker notes are written per slide as staging directions for the presenter.
 * They are the one thing here not lifted from the repo, because the repo has no
 * notes field; they describe the slide rather than adding argument to it.
 *
 * Typography: 1920×1080, nothing below 24px. Headings 72–104px, body 34–40px,
 * mono labels 24–28px. Two grounds only — paper for every slide, inverse for the
 * title and close.
 */

      home: "A platform. Movemental gives you the same site, and the system underneath it. Your teaching shared well, tools built for your team, a community that knows you're here, and a presence the AI can represent faithfully.",

};

const DECKS = { churches: CHURCH, nonprofits: NONPROFIT, institutions: INSTITUTION };

/** Split text around a gesture phrase; returns styled runs. */
function markPhrase(text, gesture) {
  if (!gesture || !text) return [{ text, style: {} }];
  const i = text.indexOf(gesture.phrase);
  if (i === -1) return [{ text, style: {} }];
  const hit =
    gesture.type === "highlight"
      ? { background: MARKER, mixBlendMode: "multiply", padding: "0 .08em", boxDecorationBreak: "clone", WebkitBoxDecorationBreak: "clone" }
      : gesture.type === "circle"
        ? { border: "3px solid " + RULE, borderRadius: "999px", padding: "0 .28em", margin: "0 .04em" }
        : { borderBottom: "4px solid " + RULE, paddingBottom: ".04em" };
  const out = [];
  if (i > 0) out.push({ text: text.slice(0, i), style: {} });
  out.push({ text: gesture.phrase, style: hit });
  const rest = text.slice(i + gesture.phrase.length);
  if (rest) out.push({ text: rest, style: {} });
  return out;
}

class Component extends DCLogic {
  state = { audience: null };

  renderVals() {
    const audience = this.state.audience || this.props.audience || "churches";
    const deck = DECKS[audience] || CHURCH;

    const chip = (active) => ({
      font: "inherit", fontFamily: "var(--font-mono), ui-monospace, monospace", fontSize: ".6rem",
      letterSpacing: ".12em", textTransform: "uppercase",
      border: active ? "1px solid var(--ink)" : "1px solid var(--border)",
      background: active ? "var(--surface-card)" : "transparent",
      color: active ? "var(--text-strong)" : "var(--text-body)",
      borderRadius: "999px", padding: ".34rem .72rem", cursor: "pointer",
    });

    const total = deck.slides.length;

    return {
      tabs: Object.keys(DECKS).map((k) => ({
        label: DECKS[k].label,
        style: chip(k === audience),
        select: () => this.setState({ audience: k }),
      })),
      slides: deck.slides.map((s, i) => {
        const inverse = s.kind === "title" || s.kind === "close";
        const fg = inverse ? SHEET : INK;
        const bodyFg = inverse ? "rgba(255,253,247,.86)" : BODY;
        const mutedFg = inverse ? "rgba(255,253,247,.66)" : MUTED;
        // Heading gesture wins; body gesture applies only if the heading misses.
        const headingParts = markPhrase(s.heading || "", s.gesture);
        const headingMatched = headingParts.length > 1;
        const bodyGesture = headingMatched ? null : s.gesture;

        return {
          label: s.eyebrow ? s.eyebrow.split("·")[0].trim() : s.id,
          notes: (s.notes || "") + "  Slide " + (i + 1) + " of " + total + ".",
          sectionStyle: {
            boxSizing: "border-box",
            display: "flex",
            flexDirection: "column",
            justifyContent: s.kind === "title" ? "center" : "flex-start",
            padding: "104px 132px 92px",
            background: inverse ? INK : PAPER,
            color: fg,
            fontFamily: "var(--font-body), system-ui, sans-serif",
          },
          eyebrowStyle: {
            fontFamily: "var(--font-mono), ui-monospace, monospace",
            fontSize: "26px",
            letterSpacing: ".18em",
            textTransform: "uppercase",
            color: mutedFg,
            marginBottom: "34px",
            paddingLeft: "22px",
            borderLeft: "3px solid " + RULE,
          },
          eyebrow: s.eyebrow || "",
          headingStyle: {
            fontFamily: "var(--font-display), Georgia, serif",
            fontWeight: 600,
            fontSize: s.kind === "title" ? "104px" : "78px",
            lineHeight: 1.06,
            letterSpacing: "-.026em",
            margin: 0,
            maxWidth: "24ch",
            textWrap: "pretty",
            color: fg,
          },
          headingParts,
          hasParts: !!s.parts,
          parts: s.parts || [],
          hasBody: !!(s.body && s.body.length),
          bodyWrapStyle: { marginTop: s.parts ? "44px" : "48px", maxWidth: "46ch" },
          bodyStyle: {
            fontSize: s.kind === "title" ? "40px" : "36px",
            lineHeight: 1.5,
            color: bodyFg,
            margin: "0 0 26px",
          },
          body: (s.body || []).map((p) => ({ parts: markPhrase(p, bodyGesture) })),
          isDiagram: s.kind === "diagram",
          surfaceTiles: deck.diagram.surfaceTiles,
          surfaceChips: deck.diagram.surfaceChips,
          systemTiles: deck.diagram.systemTiles,
          captionSite: deck.diagram.captions.site,
          captionHome: deck.diagram.captions.home,
          offLabel: deck.diagram.toggleLabels.off,
          onLabel: deck.diagram.toggleLabels.on,
          footStyle: {
            marginTop: "auto",
            paddingTop: "40px",
            display: "flex",
            justifyContent: "space-between",
            fontFamily: "var(--font-mono), ui-monospace, monospace",
            fontSize: "24px",
            letterSpacing: ".14em",
            textTransform: "uppercase",
            color: mutedFg,
          },
          foot: deck.foot,
        };
      }),
    };
  }
}
</script>
</body>
</html>
