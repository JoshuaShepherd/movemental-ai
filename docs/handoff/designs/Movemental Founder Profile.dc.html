<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/colors.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/typography.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/styles.css">
  <script src="_ds/movemental-design-system-07416b17-5fe0-4d95-8869-3ddc9e650bc9/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--text-strong); font-family: var(--font-body), system-ui, sans-serif; font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--accent-press); text-decoration: underline; text-underline-offset: 3px; }
    @keyframes mvmRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .mvm-reveal { animation: mvmRise .55s cubic-bezier(.2,.7,.2,1) both; animation-timeline: view(); animation-range: entry 3% entry 30%; }
    .mvm-vcard { transition: border-color var(--dur-fast), transform var(--dur-fast), box-shadow var(--dur-fast); }
    .mvm-vcard:hover { border-color: var(--ink); transform: translateY(-1px); box-shadow: var(--shadow-lift); text-decoration: none; }
  </style>
</helmet>

<div style="min-height: 100dvh; background: var(--bg); padding-bottom: 6rem;">

  <header style="position: sticky; top: 0; z-index: 40; height: 3.6rem; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 clamp(1rem,4vw,2.5rem); border-bottom: 1px solid var(--border); background: rgba(251,250,246,.92); backdrop-filter: blur(8px);">
    <a href="Movemental Home v4.dc.html" style="display: flex; align-items: center; line-height: 0;">
      <img src="public/images/brand/movemental-logo-light.webp" alt="Movemental" style="display: block; width: auto; height: 3.4rem; margin: -.35rem 0;">
    </a>
    <x-import component-from-global-scope="MovementalDesignSystem_07416b.Crumb" onClick="{{ goAbout }}" style="{{ crumbStyle }}" hint-size="auto,1rem">↑ About</x-import>
  </header>

  <div style="border-bottom: 1px solid var(--border); background: var(--surface);">
    <div style="max-width: 1080px; margin: 0 auto; padding: .55rem clamp(1.25rem,5vw,3rem); display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;">
      <span style="font-family: var(--font-mono), ui-monospace, monospace; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-body); margin-right: .35rem;">Founder</span>
      <sc-for list="{{ picker }}" as="p" hint-placeholder-count="3">
        <button type="button" onClick="{{ p.select }}" style="{{ p.style }}">{{ p.label }}</button>
      </sc-for>
    </div>
  </div>

  <article style="max-width: 1080px; margin: 0 auto; padding: clamp(2rem,5vw,3.5rem) clamp(1.25rem,5vw,3rem) 0;">

    <section style="position: relative; padding-left: clamp(1rem,2.5vw,1.6rem);">
      <span style="position: absolute; left: .2rem; top: .3rem; bottom: .6rem; width: 1.5px; background: var(--margin-red); opacity: .32;"></span>
      <x-import component-from-global-scope="MovementalDesignSystem_07416b.Eyebrow" hint-size="auto,1rem">Founder</x-import>
      <h1 style="font-family: var(--font-display), Georgia, serif; font-weight: 600; font-size: clamp(2rem,5vw,3.4rem); line-height: 1.04; letter-spacing: -.024em; margin: .7rem 0 0;">{{ f.name }}</h1>
      <p style="font-family: var(--font-mono), ui-monospace, monospace; font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; color: var(--text-body); margin: .7rem 0 0; line-height: 1.6;">{{ f.jobTitle }}</p>
    </section>

    <section style="display: flex; flex-wrap: wrap; gap: clamp(1.25rem,3.5vw,2.5rem); align-items: flex-start; margin-top: clamp(1.75rem,4vw,2.5rem);">
      <x-import component-from-global-scope="MovementalDesignSystem_07416b.LeaderFace" src="{{ f.img }}" name="{{ f.name }}" size="{{ portraitSize }}" caption="{{ false }}" hint-size="180px,180px"></x-import>
      <div style="flex: 1 1 22rem; min-width: 0;">
        <p style="font-family: var(--font-display), Georgia, serif; font-size: clamp(1.15rem,2.4vw,1.5rem); line-height: 1.34; letter-spacing: -.012em; margin: 0; max-width: 42ch; text-wrap: pretty;">{{ f.oneLine }}</p>
        <sc-if value="{{ f.hasLinks }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.1rem;">
            <sc-for list="{{ f.sameAs }}" as="l" hint-placeholder-count="2">
              <a href="{{ l.href }}" target="_blank" rel="noopener noreferrer" style="font-family: var(--font-mono), ui-monospace, monospace; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--border); border-radius: 999px; padding: .55rem .95rem; background: var(--surface-card); color: var(--text-body);" style-hover="color: var(--ink-blue); border-color: var(--ink); text-decoration: none;">{{ l.label }} ↗</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </section>

    <section class="mvm-reveal" style="margin-top: clamp(2.25rem,5vw,3rem); position: relative; padding-left: clamp(1rem,2.5vw,1.6rem); max-width: 66ch;">
      <span style="position: absolute; left: .2rem; top: .4rem; bottom: .4rem; width: 1.5px; background: var(--margin-red); opacity: .32;"></span>
      <sc-for list="{{ f.fullBio }}" as="para" hint-placeholder-count="4">
        <p style="font-size: 1.06rem; line-height: 1.7; color: var(--text-strong); margin: 0 0 1.15rem;">{{ para }}</p>
      </sc-for>
    </section>

    <sc-if value="{{ f.hasTrustLine }}" hint-placeholder-val="{{ false }}">
      <section class="mvm-reveal" style="margin-top: clamp(1.5rem,3vw,2rem); border: 1px solid var(--ink); border-radius: var(--radius-lg); background: var(--surface-card); padding: clamp(1.1rem,3vw,1.5rem); max-width: 62ch;">
        <x-import component-from-global-scope="MovementalDesignSystem_07416b.SectionLabel" style="{{ zeroMargin }}" hint-size="auto,1rem">The trust seat</x-import>
        <p style="font-family: var(--font-display), Georgia, serif; font-size: clamp(1.1rem,2.3vw,1.35rem); line-height: 1.42; letter-spacing: -.012em; margin: .7rem 0 0;">{{ f.trustLine }}</p>
      </section>
    </sc-if>

    <section class="mvm-reveal" style="margin-top: clamp(2.5rem,6vw,3.5rem);">
      <x-import component-from-global-scope="MovementalDesignSystem_07416b.SectionLabel" hint-size="auto,1rem">The arc</x-import>
      <div style="display: grid; gap: .8rem;">
        <sc-for list="{{ f.arc }}" as="a" hint-placeholder-count="5">
          <x-import component-from-global-scope="MovementalDesignSystem_07416b.PathLayer" n="{{ a.period }}" term="{{ a.detail }}" hint-size="100%,1.5rem"></x-import>
        </sc-for>
      </div>
    </section>

    <section class="mvm-reveal" style="margin-top: clamp(2.5rem,6vw,3.5rem); display: grid; gap: clamp(1.5rem,4vw,3rem); grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));">
      <div>
        <x-import component-from-global-scope="MovementalDesignSystem_07416b.SectionLabel" hint-size="auto,1rem">Selected work</x-import>
        <div style="display: grid; gap: .6rem;">
          <sc-for list="{{ f.selectedWork }}" as="w" hint-placeholder-count="4">
            <div style="border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-card); padding: .9rem 1rem;">
              <h4 style="font-family: var(--font-display), Georgia, serif; font-weight: 600; font-size: 1.05rem; line-height: 1.2; margin: 0;">{{ w.title }}</h4>
              <p style="font-size: .93rem; line-height: 1.55; color: var(--text-body); margin: .4rem 0 0;">{{ w.detail }}</p>
            </div>
          </sc-for>
        </div>
      </div>
      <div>
        <x-import component-from-global-scope="MovementalDesignSystem_07416b.SectionLabel" hint-size="auto,1rem">What they carry</x-import>
        <ul style="margin: 0 0 1.6rem; padding: 0; list-style: none; display: grid; gap: .5rem;">
          <sc-for list="{{ f.skills }}" as="s" hint-placeholder-count="4">
            <li style="font-size: .97rem; line-height: 1.5; color: var(--text-body); border-left: 1px solid var(--border); padding-left: .85rem;">{{ s }}</li>
          </sc-for>
        </ul>
        <x-import component-from-global-scope="MovementalDesignSystem_07416b.SectionLabel" hint-size="auto,1rem">Knows about</x-import>
        <div style="display: flex; flex-wrap: wrap; gap: .4rem;">
          <sc-for list="{{ f.knowsAbout }}" as="k" hint-placeholder-count="4">
            <span style="font-family: var(--font-mono), ui-monospace, monospace; font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-body); border: 1px solid var(--border); border-radius: 999px; padding: .32rem .65rem;">{{ k }}</span>
          </sc-for>
        </div>
      </div>
    </section>

    <section class="mvm-reveal" style="margin-top: clamp(2.75rem,6vw,4rem); border-top: 1px solid var(--border); padding-top: clamp(1.75rem,4vw,2.5rem);">
      <x-import component-from-global-scope="MovementalDesignSystem_07416b.SectionLabel" hint-size="auto,1rem">The other two</x-import>
      <div style="display: grid; gap: clamp(.75rem,2vw,1rem); grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));">
        <sc-for list="{{ others }}" as="o" hint-placeholder-count="2">
          <button type="button" class="mvm-vcard" onClick="{{ o.select }}" style="{{ otherStyle }}">
            <span style="display: block; font-family: var(--font-display), Georgia, serif; font-weight: 600; font-size: 1.1rem; line-height: 1.2;">{{ o.name }}</span>
            <span style="display: block; font-family: var(--font-mono), ui-monospace, monospace; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-body); margin-top: .4rem; line-height: 1.5;">{{ o.jobTitle }}</span>
          </button>
        </sc-for>
      </div>
      <p style="margin: 1.5rem 0 0;"><a href="Movemental About Founders.dc.html">← Back to about</a></p>
    </section>

  </article>
</div>
</x-dc>

 * `/agent-room/leaders/N.jpg` paths are not in this project.
 */

class Component extends DCLogic {
  state = { slug: null };

  componentDidMount() {
    const hash = (window.location.hash || "").replace("#", "");
    if (FOUNDERS.some((f) => f.slug === hash)) this.setState({ slug: hash });
  }

  pick = (slug) => {
    this.setState({ slug });
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", "#" + slug);
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  renderVals() {
    const slug = this.state.slug || this.props.slug || FOUNDERS[0].slug;
    const found = FOUNDERS.find((x) => x.slug === slug) || FOUNDERS[0];
    const chip = (active) => ({
      font: "inherit",
      fontFamily: "var(--font-mono), ui-monospace, monospace",
      fontSize: ".6rem",
      letterSpacing: ".11em",
      textTransform: "uppercase",
      border: active ? "1px solid var(--ink)" : "1px solid var(--border)",
      background: active ? "var(--surface-card)" : "transparent",
      color: active ? "var(--text-strong)" : "var(--text-body)",
      borderRadius: "999px",
      padding: ".34rem .7rem",
      cursor: "pointer",
    });
    return {
      goAbout: () => { window.location.href = "Movemental About Founders.dc.html"; },
      crumbStyle: { marginBottom: 0 },
      zeroMargin: { margin: 0 },
      portraitSize: 176,
      f: {
        ...found,
        hasLinks: found.sameAs.length > 0,
        hasTrustLine: !!found.trustLine,
        trustLine: found.trustLine || "",
      },
      picker: FOUNDERS.map((x) => ({
        label: x.name,
        style: chip(x.slug === found.slug),
        select: () => this.pick(x.slug),
      })),
      others: FOUNDERS.filter((x) => x.slug !== found.slug).map((x) => ({
        name: x.name,
        jobTitle: x.jobTitle,
        select: () => this.pick(x.slug),
      })),
      otherStyle: {
        font: "inherit",
        textAlign: "left",
        border: "1px solid var(--border)",
        borderRadius: "var(--radius-lg)",
        background: "var(--surface-card)",
        padding: "1rem 1.1rem",
        cursor: "pointer",
        color: "var(--text-strong)",
      },
    };
  }
}

</html>
