<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Style Finder</title>
    <meta name="description" content="Movemental visual style discovery tool — typography, templates, images, and palettes for Stitch / React migration." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Proza+Libre:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Bricolage+Grotesque:wght@400;600;700&family=Syne:wght@400;600;700;800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Instrument+Sans:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Libre+Caslon+Display&family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Gloock&family=Young+Serif&family=Hedvig+Letters+Serif&family=Bitter:ital,wght@0,400;0,600;1,400&family=Familjen+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Albert+Sans:wght@400;500;600;700&family=Onest:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Unbounded:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body class="ink-band-surface">
    <!--
      Static HTML prototype — source for Next.js / Tailwind migration.
      Open via local server (ES modules): pnpm exec serve docs/html/visual-style-finder
      Tokens: styles/tokens.css → Tailwind @theme
      Data: js/data/* → lib/visual-style-finder/*
      UI steps: js/app.js render* → app/(studio)/style-finder/*
    -->
    <header class="top">
      <div class="wm">Style&nbsp;Finder<span class="d">.</span></div>
      <nav class="steps" id="steps" aria-label="Wizard steps"></nav>
      <div class="tally" id="tally"><b>0</b> selected</div>
    </header>

    <main class="stage" id="stage" aria-live="polite"></main>

    <footer class="bot">
      <div class="hint" id="hint"></div>
      <div class="acts" id="acts"></div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite">Copied</div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
